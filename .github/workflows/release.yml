name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest' # for windows
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies
        run: pnpm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bilal Invoice ${{ github.ref_name }}'
          releaseBody: |
            ### Features
            - **Dynamic Release Notes:** The app now fetches live updates directly from GitHub! You will see real-time release notes before downloading.
            - **Automated What's New:** The post-update popup now dynamically pulls your release notes, eliminating the need to update internal changelogs.
            
            ### Improvements
            - Redesigned the History page to follow the sleek Windows 11 Fluent Design system (Acrylic blurs, flat interactions, monoline icons).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
