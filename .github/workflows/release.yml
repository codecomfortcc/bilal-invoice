name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest' # for windows
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: "tauri-windows"

      - name: install dependencies
        run: pnpm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bilal Invoice ${{ github.ref_name }}'
          releaseBody: |
            ### Features
            - **Signature Selection:** You can now toggle between uploading an Image or typing a Text signature in the settings.
            - **Customizable Invoice Dates:** Double-click the Date or Signature headings to customize their font family, size, and color permanently.
            - **Auto Date Toggle:** Added a smart "Auto Date" toggle inside the date popover menu to automatically inject today's date into your invoices and signatures.
            
            ### Improvements
            - Redesigned the History page to follow the sleek Windows 11 Fluent Design system.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
